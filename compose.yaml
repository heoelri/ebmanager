services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: einsatzberichte
      MYSQL_USER: einsatzberichte
      MYSQL_PASSWORD: local-password
      MYSQL_ROOT_PASSWORD: test-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -ptest-password]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: mysql:8.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: einsatzberichte
      DB_USER: einsatzberichte
      DB_PASSWORD: local-password
    volumes:
      - ./docker/migrate.sh:/usr/local/bin/migrate.sh:ro
      - ./migrations:/migrations:ro
    command: [bash, /usr/local/bin/migrate.sh]
    restart: "no"

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: mysql:host=db;dbname=einsatzberichte;charset=utf8mb4
      DB_USER: einsatzberichte
      DB_PASSWORD: local-password
      SETUP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_URL: https://localhost:8443
      MAIL_FROM: einsatzberichte@localhost.test
      DIVERA_API_BASE_URL: ${DIVERA_API_BASE_URL:-https://app.divera247.com}
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:80
      - 127.0.0.1:${HTTPS_PORT:-8443}:443
    volumes:
      - ./api.php:/var/www/html/api.php:ro
      - ./constants.php:/var/www/html/constants.php:ro
      - ./support.php:/var/www/html/support.php:ro
      - ./.htaccess:/var/www/html/.htaccess:ro
      - ./public:/var/www/html/public:ro
    healthcheck:
      test: [CMD, curl, --fail, --insecure, https://localhost/api/bootstrap]
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    profiles: [test]
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      DB_USER: root
      DB_PASSWORD: test-password
      SETUP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_BASE_URL: https://web
      TEST_DB_HOST: db
      DIVERA_API_BASE_URL: ${DIVERA_API_BASE_URL:-https://app.divera247.com}
    volumes:
      - divera-test-data:/tmp/divera
    command: [bash, test/smoke.sh]

  demo-seed:
    profiles: [demo]
    image: mysql:8.4
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: einsatzberichte
      DB_USER: einsatzberichte
      DB_PASSWORD: local-password
    volumes:
      - ./docker/demo-seed.sh:/usr/local/bin/demo-seed.sh:ro
      - ./demo/seed.sql:/demo/seed.sql:ro
    command: [bash, /usr/local/bin/demo-seed.sh]
    restart: "no"

  divera:
    profiles: [test]
    image: php:8.5-cli
    working_dir: /app
    environment:
      DIVERA_REQUEST_LOG: /tmp/divera/requests.log
    volumes:
      - ./test:/app/test:ro
      - divera-test-data:/tmp/divera
    command: [php, -S, 0.0.0.0:8090, test/fake-divera.php]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://localhost:8090/api/v2/alarms?accesskey=test')===false);"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  mysql-data:
  divera-test-data:
