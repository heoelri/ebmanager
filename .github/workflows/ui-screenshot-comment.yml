name: UI-Screenshots im Pull Request

on:
  workflow_run:
    workflows:
      - UI-Screenshots
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ui-screenshot-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Screenshots herunterladen
        uses: actions/download-artifact@v5
        with:
          name: ui-screenshots
          path: screenshots
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: GitHub CLI installieren
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gh_2.99.0_linux_amd64.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/cli/cli/releases/download/v2.99.0/gh_2.99.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "ed4960225d2833e04a61590d9fa2b5773d147f3aa375459e5466a40c102f3832  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          echo "/tmp/gh_2.99.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Screenshots einbetten
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find screenshots -maxdepth 1 -type f -name '*.png' | sort)
          test "${#files[@]}" -eq 16
          pr_number="$PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            mapfile -t pull_requests < <(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state == "open") | .number')
            test "${#pull_requests[@]}" -eq 1
            pr_number="${pull_requests[0]}"
          fi
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
          if [[ "$current_head" != "$HEAD_SHA" ]]; then
            echo "Überspringe veraltete Screenshots für $HEAD_SHA; aktueller PR-Stand ist $current_head."
            exit 0
          fi

          {
            echo '<!-- ui-screenshots -->'
            echo
            echo '## UI-Screenshots'
            echo
            echo "[Workflow-Artefakt herunterladen]($RUN_URL)"
            echo
            echo 'Die PNG-Dateien stehen im Artefakt bereit; der Kommentar lädt keine Medienanhänge hoch, damit der Workflow ausschließlich mit dem automatisch bereitgestellten `GITHUB_TOKEN` läuft.'
            for group in '01:Anmeldung' '10:Führungskraft' '20:Einheitsführung' '30:Wehrführung'; do
              prefix="${group%%:*}"
              title="${group#*:}"
              echo
              echo "<details><summary>$title</summary>"
              echo
              for file in "screenshots/$prefix"-*.png; do
                label="$(basename "${file%.png}")"
                label="${label//-/ }"
                echo "- $label"
              done
              echo '</details>'
            done
          } > /tmp/ui-screenshots.md
          marker='<!-- ui-screenshots -->'
          mapfile -t old_comments < <(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id")
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/ui-screenshots.md
          for comment_id in "${old_comments[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          done
