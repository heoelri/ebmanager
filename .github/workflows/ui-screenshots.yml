name: UI-Screenshots

on:
  pull_request:
    paths:
      - public/**
      - test/ui-screenshots.mjs
      - .github/workflows/ui-screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Demo-System starten
        env:
          DIVERA_API_BASE_URL: http://divera:8090
        run: |
          docker compose --profile demo up --build --detach --wait divera web
          docker compose --profile demo run --rm demo-seed
      - name: Screenshots erstellen
        run: |
          network="$(docker inspect "$(docker compose ps -q web)" \
            --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          test -n "$network"
          docker run --rm \
            --network "$network" \
            --volume "$PWD:/work" \
            --workdir /work \
            --env SCREENSHOT_BASE_URL=https://web \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --prefix /tmp/ui --no-save --package-lock=false playwright@1.55.0 && cp test/ui-screenshots.mjs /tmp/ui/ && node /tmp/ui/ui-screenshots.mjs'
      - name: Screenshots als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - name: Container und Volumes entfernen
        if: always()
        run: docker compose --profile demo down --volumes
