name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: PHP and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: einsatzberichte
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: PHP und MySQL-Client installieren
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends php-cli php-mysql mysql-client
      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testskripte prüfen
        run: bash -n test/smoke.sh test/migrations.sh test/demo-seed.sh docker/migrate.sh docker/demo-seed.sh
      - name: Frontend prüfen
        run: node test/frontend.mjs
      - name: Schema und API prüfen
        env:
          MYSQL_PWD: test-password
        run: |
          mysql --host=127.0.0.1 --user=root einsatzberichte < schema.sql
          bash test/smoke.sh

  containers:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compose-Konfiguration prüfen
        run: docker compose config --quiet
      - name: Migrationen idempotent ausführen
        run: bash test/migrations.sh
      - name: Images bauen und End-to-End-Test ausführen
        env:
          BUILD_ID: ${{ github.sha }}
          DIVERA_API_BASE_URL: http://divera:8090
        run: |
          docker compose --profile test up --build --detach --wait divera web
          docker compose --profile test run --rm --no-deps test
      - name: Demo-Seed prüfen
        run: bash test/demo-seed.sh
      - name: Container und Volumes entfernen
        if: always()
        run: docker compose --profile test down --volumes
