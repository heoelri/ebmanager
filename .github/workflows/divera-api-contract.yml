name: DIVERA API contract

on:
  pull_request:
    paths:
      - api.php
      - test/fake-divera.php
      - test/divera-api-contract.sh
      - .github/workflows/divera-api-contract.yml
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare official API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare fake with official OpenAPI
        run: bash test/divera-api-contract.sh
