name: Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: hiba-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hiba
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - name: Anwendung per SFTP hochladen
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          BUILD_ID: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SFTP_SERVER:?Secret SFTP_SERVER fehlt}"
          : "${SFTP_USERNAME:?Secret SFTP_USERNAME fehlt}"
          : "${SFTP_KNOWN_HOSTS:?Secret SFTP_KNOWN_HOSTS fehlt}"

          if [[ -z "${SFTP_PRIVATE_KEY:-}" && -z "${SFTP_PASSWORD:-}" ]]; then
            echo "Secret SFTP_PRIVATE_KEY oder SFTP_PASSWORD fehlt" >&2
            exit 1
          fi

          port="${SFTP_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]{1,5}$ ]] || ((port < 1 || port > 65535)); then
            echo "Secret SFTP_PORT muss eine Portnummer sein" >&2
            exit 1
          fi

          remote_path="${SFTP_PATH:-}"
          remote_path="${remote_path#/}"
          remote_path="${remote_path%/}"
          if [[ -n "$remote_path" && ! "$remote_path" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Secret SFTP_PATH enthält unzulässige Zeichen" >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          chmod 700 "$workdir"
          printf '%s\n' "$BUILD_ID" >.build-id

          printf '%s\n' "$SFTP_KNOWN_HOSTS" >"$workdir/known_hosts"
          chmod 600 "$workdir/known_hosts"

          ssh_options=(
            -o "StrictHostKeyChecking=yes"
            -o "UserKnownHostsFile=$workdir/known_hosts"
            -o "Port=$port"
          )

          if [[ -n "${SFTP_PRIVATE_KEY:-}" ]]; then
            printf '%s\n' "$SFTP_PRIVATE_KEY" >"$workdir/id_deploy"
            chmod 600 "$workdir/id_deploy"
            ssh_options+=(
              -o "BatchMode=yes"
              -o "IdentitiesOnly=yes"
              -o "PasswordAuthentication=no"
              -i "$workdir/id_deploy"
            )
            sftp_command=(sftp)
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
            ssh_options+=(
              -o "BatchMode=no"
              -o "PubkeyAuthentication=no"
              -o "PreferredAuthentications=password,keyboard-interactive"
              -o "NumberOfPasswordPrompts=1"
            )
            export SSHPASS="$SFTP_PASSWORD"
            sftp_command=(sshpass -e sftp)
          fi

          {
            if [[ -n "$remote_path" ]]; then
              printf 'cd "%s"\n' "$remote_path"
            fi
            printf -- '-mkdir "public"\n'
            printf 'put ".htaccess" ".htaccess"\n'
            printf 'put ".build-id" ".build-id"\n'
            printf 'put "api.php" "api.php"\n'
            printf 'put "constants.php" "constants.php"\n'
            printf 'put "support.php" "support.php"\n'
            printf 'put "public/index.html" "public/index.html"\n'
            printf 'put "public/app.js" "public/app.js"\n'
            printf 'put "public/styles.css" "public/styles.css"\n'
          } >"$workdir/batch"

          "${sftp_command[@]}" "${ssh_options[@]}" \
            -b "$workdir/batch" \
            "${SFTP_USERNAME}@${SFTP_SERVER}"
