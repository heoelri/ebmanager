<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Einsatzberichte</title>
  <style>
    :root{font:16px/1.5 system-ui;color:#18202b;background:#f3f5f7;-webkit-text-size-adjust:100%}*{box-sizing:border-box}body{margin:0;overflow-wrap:anywhere}header{background:#b71918;color:#fff;padding:calc(1rem + env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right)) 1rem max(4vw,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:2rem auto;padding:0 max(1rem,env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));outline:0}.card{background:#fff;border-radius:.6rem;padding:1rem;margin:1rem 0;box-shadow:0 1px 5px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:.8rem}fieldset{min-width:0}label{display:grid;gap:.3rem;font-weight:600}input:not([type=checkbox]),select,textarea,button{font:inherit;min-height:44px;padding:.65rem;border:1px solid #aeb7c2;border-radius:.35rem}input,select,textarea{max-width:100%;background:#fff;color:#18202b}textarea{min-height:7rem;resize:vertical}button{background:#b71918;color:white;border:0;cursor:pointer;touch-action:manipulation}button:disabled{background:#737b82;cursor:not-allowed}button.secondary{background:#536170}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #005fcc;outline-offset:3px}a{color:#075a9c}nav{display:flex;gap:.5rem;flex-wrap:wrap}.skip-link{position:fixed;z-index:10;left:1rem;top:1rem;background:#fff;color:#18202b;padding:.7rem;transform:translateY(-200%)}.skip-link:focus{transform:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.hidden{display:none}.error{background:#ffe5e5;color:#8d0000;padding:.7rem;border-radius:.35rem}.muted{color:#5c6670}.report{border-left:4px solid #b71918;padding-left:1rem;margin:1rem 0}.report-fields{grid-column:1/-1}.form-section{border:1px solid #ccd2d9;border-radius:.5rem;margin:.8rem 0;overflow:hidden}.form-section>summary{cursor:pointer;font-weight:700;min-height:44px;padding:.7rem;background:#e8ebef}.form-section>.grid,.form-section>.check-grid{padding:.8rem}.command-row{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:.8rem}.report-times{margin:.7rem 0}.report-times div{display:grid;grid-template-columns:8rem 1fr;gap:.5rem}.report-times dt{font-weight:700}.report-times dd{margin:0}.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:.4rem}.check-grid label{display:flex;align-items:flex-start;min-height:44px;padding:.45rem;font-weight:400}.check-grid input{flex:0 0 1.25rem;width:1.25rem;height:1.25rem;margin:.15rem .55rem 0 0}.duration{font-weight:700;padding:.7rem;background:#f3f5f7;border-radius:.35rem}.crew-zone{background:#f3f5f7;border:2px dashed #aeb7c2;border-radius:.5rem;padding:.65rem;min-height:6rem}.crew-zone.over{border-color:#b71918;background:#fff2f2}.crew-zone h4,.crew-zone h5{margin:0 0 .6rem;display:flex;justify-content:space-between}.crew-pool{width:100%;margin-top:.5rem;min-height:9rem}.crew-pool .crew-list{display:flex;flex-wrap:wrap;gap:.5rem}.crew-available{grid-column:1/-1;margin-top:1rem}.crew-available summary{cursor:pointer;font-weight:700;min-height:44px;padding:.7rem;background:#e8ebef;border-radius:.4rem}.vehicle-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:.8rem}.vehicle-column{border:1px solid #aeb7c2;border-radius:.5rem;padding:.65rem;background:#fff}.vehicle-column>h4{margin:.1rem 0 .7rem}.crew-role{margin-top:.5rem}.crew-person{background:#fff;border:1px solid #ccd2d9;border-radius:.4rem;padding:.55rem;cursor:grab;box-shadow:0 1px 2px #0001}.crew-pool .crew-person{width:min(230px,100%)}.crew-person.dragging{opacity:.45}.crew-person strong,.crew-person small{display:block;margin-bottom:.35rem}.crew-person select{width:100%}h1,h2,h3{margin:.3rem 0 1rem}dialog{border:0;border-radius:.6rem;max-width:1000px;width:calc(100% - 2rem);max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2rem);padding:1rem;overflow:auto}dialog::backdrop{background:#0008}@media(pointer:coarse){.crew-person{cursor:default}}@media(max-width:600px){header{align-items:flex-start;gap:1rem;flex-direction:column}main{margin:.75rem auto}.card{padding:.85rem}.grid,.vehicle-board{grid-template-columns:1fr}nav{width:100%}nav button{flex:1 1 auto}dialog{width:100%;max-height:100vh;max-height:100dvh;height:100vh;height:100dvh;border-radius:0;margin:0}}
  </style>
</head>
<body>
<a class="skip-link" href="#app">Zum Inhalt springen</a>
<header><strong><span aria-hidden="true">🚒 </span>Einsatzberichte</strong><nav id="nav" aria-label="Hauptnavigation"></nav></header>
<main id="app" tabindex="-1"></main>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<script>
const app=document.querySelector('#app'),nav=document.querySelector('#nav'),dialog=document.querySelector('#dialog'),announcer=document.querySelector('#announcer');
let me,units=[],incidents=[],pendingDivera=[],incidentTypes=[],ranks={},reportClassifications={},classificationLabels={},pendingWarning='';
const dragEnabled=matchMedia('(pointer:fine)').matches;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path.replace(/^\/api(?=\/|$)/,'api'),{...options,headers:{'content-type':'application/json',...options.headers}}),data=await r.json();if(!r.ok)throw Error(data.error);if(data.warning)pendingWarning=data.warning;return data}
function formData(form){return Object.fromEntries(new FormData(form))}
function showError(e){const root=dialog.open?dialog:app;root.querySelector('[role=alert]')?.remove();root.insertAdjacentHTML('afterbegin',`<p class="error" role="alert" tabindex="-1">${esc(e.message)}</p>`);root.querySelector('[role=alert]').focus()}
function focusMain(){if(pendingWarning){app.insertAdjacentHTML('afterbegin',`<p class="error" role="alert">${esc(pendingWarning)}</p>`);announcer.textContent=pendingWarning;pendingWarning=''}const heading=app.querySelector('h1');if(!heading)return;heading.tabIndex=-1;heading.focus({preventScroll:true});document.title=`${heading.textContent} – Einsatzberichte`}
function bindForm(id,handler){document.querySelector(id).onsubmit=async e=>{e.preventDefault();const button=e.submitter;button?.setAttribute('disabled','');e.target.setAttribute('aria-busy','true');announcer.textContent='Wird verarbeitet';try{await handler(formData(e.target))}catch(x){showError(x)}finally{button?.removeAttribute('disabled');e.target.removeAttribute('aria-busy');announcer.textContent=''}}}
function setIncidentLocation(id){const url=new URL(location.href);url.searchParams.delete('incident');if(id)url.searchParams.set('incident',id);history.replaceState({},'',url)}
async function initialView(){const value=new URLSearchParams(location.search).get('incident'),id=/^[1-9]\d*$/.test(value||'')?Number(value):0;if(id&&incidents.some(item=>item.id===id))await incident(id);else home()}
async function start(){
  let state;
  try{state=await api('/api/bootstrap')}catch(e){return databaseUnavailable(e.message)}
  if(state.needsSetup)return setup();
  const parameters=new URLSearchParams(location.search),invite=parameters.get('invite'),resetToken=invite||parameters.get('reset');
  if(resetToken)return resetPassword(resetToken,Boolean(invite));
  try{me=await api('/api/me');await load();await initialView()}catch{login()}
}
function databaseUnavailable(message){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>Datenbank nicht verfügbar</h1><p class="error" role="alert">${esc(message)}</p><p>Prüfen Sie die Datenbankwerte in <code>config.local.php</code> oder den Umgebungsvariablen und importieren Sie fehlende SQL-Migrationen.</p><button onclick="location.reload()">Erneut prüfen</button></section>`;focusMain()}
function setup(){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>Ersteinrichtung</h1><form id="setup" class="grid">
  <label>Wehr<input name="organization" required></label><label>Erste Einheit<input name="unit" required></label>
  <label>Ihr Name<input name="name" autocomplete="name" required></label><label>E-Mail<input name="email" type="email" autocomplete="email" required></label>
  <label>Einrichtungstoken<input name="setupToken" type="password" autocomplete="off" required></label>
  <label>Passwort (min. 10 Zeichen)<input name="password" type="password" minlength="10" required></label><button>Einrichten</button>
  </form></section>`;focusMain();bindForm('#setup',async d=>{await api('/api/setup',{method:'POST',body:JSON.stringify(d)});login()})}
function login(){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>Anmelden</h1><form id="login" class="grid">
  <label>E-Mail<input name="email" type="email" autocomplete="email" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button>
  </form><p><button type="button" class="secondary" onclick="forgotPassword()">Passwort vergessen</button></p></section>`;focusMain();bindForm('#login',async d=>{await api('/api/login',{method:'POST',body:JSON.stringify(d)});me=await api('/api/me');await load();await initialView()})}
function forgotPassword(){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>Passwort vergessen</h1><p>Wir senden einen Wiederherstellungslink an die hinterlegte Adresse.</p><form id="forgot" class="grid"><label>E-Mail<input name="email" type="email" autocomplete="email" required></label><button>Link anfordern</button><button type="button" class="secondary" onclick="login()">Zurück</button></form></section>`;focusMain();bindForm('#forgot',async d=>{await api('/api/password-reset/request',{method:'POST',body:JSON.stringify(d)});app.innerHTML='<section class="card"><h1>E-Mail prüfen</h1><p>Falls ein Konto mit dieser Adresse existiert, wurde ein Wiederherstellungslink versendet.</p><button onclick="login()">Zur Anmeldung</button></section>';focusMain()})}
function resetPassword(token,invitation=false){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>${invitation?'Konto aktivieren':'Neues Passwort'}</h1><form id="reset" class="grid"><label>Neues Passwort (min. 10 Zeichen)<input name="password" type="password" autocomplete="new-password" minlength="10" required></label><label>Passwort wiederholen<input name="confirmation" type="password" autocomplete="new-password" minlength="10" required></label><button>${invitation?'Konto aktivieren':'Passwort speichern'}</button></form></section>`;focusMain();bindForm('#reset',async d=>{if(d.password!==d.confirmation)throw Error('Passwörter stimmen nicht überein');await api('/api/password-reset/confirm',{method:'POST',body:JSON.stringify({token,password:d.password})});history.replaceState({},'',location.pathname);login()})}
async function load(){[units,incidents,{incidentTypes,ranks,classifications:reportClassifications,classificationLabels}]=await Promise.all([api('/api/units'),api('/api/incidents'),api('/api/options')]);nav.innerHTML=`
  <button type="button" onclick="home()">Einsätze</button><button type="button" onclick="resources()">Mitglieder & Fahrzeuge</button>${me.role==='wehrleitung'?'<button type="button" onclick="admin()">Verwaltung</button><button type="button" onclick="systemOverview()">System</button>':''}
  ${me.role!=='fuehrungskraft'?'<button type="button" onclick="divera()">DIVERA</button>':''}<button type="button" class="secondary" onclick="logout()">Abmelden</button>`}
async function logout(){await api('/api/logout',{method:'POST'});me=null;login()}
function home(){setIncidentLocation();app.innerHTML=`<h1>${esc(me.organization_name)}</h1><p class="muted">${esc(me.name)} · ${esc(me.role)}</p>
  <section class="card"><h2>Einsatz anlegen</h2><form id="incident" class="grid">
  <label>Stichwort<input name="title" required></label><label>Zeitpunkt<input name="startedAt" type="datetime-local" required></label>
  <label>Adresse<input name="address" autocomplete="street-address"></label><fieldset><legend>Einheiten</legend><div class="check-grid">${units.filter(u=>me.role==='wehrleitung'||me.unitIds.includes(u.id)).map(u=>`<label><input type="checkbox" name="unitIds" value="${u.id}">${esc(u.name)}</label>`).join('')}</div></fieldset><button>Anlegen</button></form></section>
  ${me.role!=='fuehrungskraft'?'<section id="pendingDivera" class="card" hidden aria-live="polite"></section>':''}
  <section><h2>Einsätze</h2>${incidents.map(i=>`<article class="card"><h3>${esc(i.title)}</h3><p>${esc(new Date(i.started_at).toLocaleString('de-DE'))} · ${esc(i.address)}<br><span class="muted">${esc(i.foreign_id||'')} ${esc(i.units)}</span></p><button onclick="incident(${i.id})">Öffnen</button></article>`).join('')||'<p>Noch keine Einsätze.</p>'}</section>`;
  focusMain();bindForm('#incident',async d=>{d.unitIds=[...document.querySelectorAll('#incident [name=unitIds]:checked')].map(o=>o.value);d.startedAt=new Date(d.startedAt).toISOString();await api('/api/incidents',{method:'POST',body:JSON.stringify(d)});await load();home()});if(me.role!=='fuehrungskraft')checkPendingDivera().catch(showError)}
async function checkPendingDivera(){
  const out=document.querySelector('#pendingDivera'),allowed=units.filter(unit=>unit.divera_configured&&(me.role==='wehrleitung'||me.unitIds.includes(unit.id)));
  if(!out||!allowed.length)return;
  const importTimes=allowed.map(unit=>`${esc(unit.name)}: ${unit.last_divera_import_at?esc(new Date(unit.last_divera_import_at).toLocaleString('de-DE')):'noch kein Import'}`).join('<br>');
  out.hidden=false;out.innerHTML=`<h2>DIVERA</h2><p><b>Letzter Import:</b><br>${importTimes}</p><p class="muted">Prüfe auf neue Einsätze …</p>`;
  const results=await Promise.allSettled(allowed.map(async unit=>({unit,data:await api(`/api/units/${unit.id}/divera?summary=1`)})));
  if(!out.isConnected)return;
  pendingDivera=results.filter(result=>result.status==='fulfilled').flatMap(({value})=>{
    const latest=incidents.filter(item=>item.divera_id&&JSON.parse(item.assignments||'[]').some(assignment=>assignment.unitId===value.unit.id)).reduce((time,item)=>Math.max(time,Date.parse(item.started_at)),0);
    return value.data.alarms.filter(alarm=>!importedForUnit(alarm.id,value.unit.id)&&(!latest||Date.parse(alarm.startedAt)>latest)).map(alarm=>({unit:value.unit,alarm}));
  }).sort((a,b)=>Date.parse(b.alarm.startedAt)-Date.parse(a.alarm.startedAt));
  const failures=results.filter(result=>result.status==='rejected').length;
  out.innerHTML=`<h2>${pendingDivera.length?'Neue DIVERA-Einsätze':'DIVERA'}</h2><p><b>Letzter Import:</b><br>${importTimes}</p>${pendingDivera.map(({unit,alarm},index)=>`<article class="report"><b>${esc(alarm.title)}</b><p>${esc(new Date(alarm.startedAt).toLocaleString('de-DE'))} · ${esc(alarm.address)}<br><span class="muted">${esc(unit.name)}</span></p><button data-pending="${index}">Importieren</button></article>`).join('')||(!failures?'<p>Keine neueren Einsätze vorhanden.</p>':'')}${failures?`<p class="error" role="alert">DIVERA konnte für ${failures} ${failures===1?'Einheit':'Einheiten'} nicht geprüft werden.</p>`:''}`;
  out.querySelectorAll('[data-pending]').forEach(button=>button.onclick=()=>importPendingDivera(Number(button.dataset.pending),button));
}
async function importPendingDivera(index,button){
  const item=pendingDivera[index];button.disabled=true;button.textContent='Importiere …';
  try{await api(`/api/units/${item.unit.id}/divera/import`,{method:'POST',body:JSON.stringify({id:item.alarm.id})});await load();home()}catch(error){button.disabled=false;button.textContent='Importieren';showError(error)}
}
async function incident(id){
  try{
    const item=incidents.find(i=>i.id===id);if(!item)return home();const reports=await api(`/api/incidents/${id}/reports`);setIncidentLocation(id);
    window.currentIncident=item;
    window.currentReports=reports;
    const assignments=JSON.parse(item.assignments||'[]');
    window.currentAssignments=assignments;
    const reportUnits=units.filter(u=>assignments.some(a=>a.unitId===u.id&&!a.hasReport)&&(me.role==='wehrleitung'||me.unitIds.includes(u.id)));
    app.innerHTML=`<button class="secondary" onclick="home()">← Zurück</button><section class="card"><h1>${esc(item.title)}</h1><p><b>${esc(item.foreign_id||'')}</b> · ${esc(new Date(item.started_at).toLocaleString('de-DE'))}<br>${esc(item.address)}${item.lat!==null&&item.lng!==null?` · <a href="https://www.openstreetmap.org/?mlat=${item.lat}&mlon=${item.lng}" target="_blank" rel="noopener" aria-label="Einsatzort auf der Karte öffnen (neues Fenster)">Karte</a>`:''}</p>${item.message?`<p><b>Meldung:</b> ${esc(item.message)}</p>`:''}${item.remark?`<p><b>Bemerkung:</b> ${esc(item.remark)}</p>`:''}${item.caller?`<p><b>Meldende Person:</b> ${esc(item.caller)}</p>`:''}${item.patient?`<p><b>Patient:</b> ${esc(item.patient)}</p>`:''}<p><b>Fahrzeuge beim Import:</b><br>${vehicleSummary(assignments)}</p><p class="muted">${esc(item.units)}</p></section>
    ${reportUnits.length?`<section class="card"><h2>Bericht schreiben</h2><form id="report" class="grid">
    <label>Einheit<select id="reportUnit" name="unitId">${reportUnits.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>
    ${reportDetailsFields('new',item)}
    <div id="reportCrew" style="grid-column:1/-1"></div>
    <label style="grid-column:1/-1">Einsatzverlauf<textarea name="narrative" required></textarea></label><button type="submit" disabled>Speichern</button></form></section>`:'<section class="card"><p>Für alle verfügbaren Einheiten existiert bereits ein Einsatzbericht.</p></section>'}
    <section class="card"><h2>Einzelberichte</h2>${reports.map(r=>`<article class="report"><strong>${esc(r.unit_name)} · Nr. ${esc(r.running_number||'–')} · ${esc(r.author_name)}</strong> <span class="muted">${r.status==='released'?'freigegeben':'Entwurf'}</span>
    <p><b>${esc(r.incident_type||'Ohne Einsatzart')}</b></p>${reportTimes(r)}
    ${commandSummary(r.incident_command)}${contactSummary('Geschädigt wurde',r.damaged_party)}${contactSummary('Schädiger',r.damaging_party)}
    ${classificationSummary(r.classification)}<p><b>Besatzung:</b><br>${crewSummary(r.crew)}</p><p>${esc(r.narrative).replace(/\n/g,'<br>')}</p>
    ${r.status==='draft'&&((r.author_id===me.id)||(me.role==='einheitsleitung'&&me.unitIds.includes(r.unit_id)))?`<button onclick="editReport(${r.id})">Bearbeiten</button> `:''}
    ${r.status==='draft'&&(me.role==='wehrleitung'||(me.role==='einheitsleitung'&&me.unitIds.includes(r.unit_id)))?`<button onclick="releaseReport(${r.id},${id})">Freigeben</button>`:''}</article>`).join('')||'<p>Noch keine Berichte.</p>'}</section>
    ${me.role==='wehrleitung'?`<section class="card"><h2>Gesamtbericht</h2><form id="consolidate"><label>Konsolidierter Bericht<textarea name="text" required>${esc(item.consolidated_text)}</textarea></label><button>Speichern</button></form></section>`:''}`;
    focusMain();
    const reportUnit=document.querySelector('#reportUnit');
    if(reportUnit){const form=document.querySelector('#report'),submit=form.querySelector('button[type=submit]');bindForm('#report',async d=>{Object.assign(d,reportDetailsPayload(form));d.crew=selectedCrew('#reportCrew');await api(`/api/incidents/${id}/reports`,{method:'POST',body:JSON.stringify(d)});await load();incident(id)});await renderCrew('#reportCrew',reportUnit.value,assignments);bindDuration(form);reportUnit.onchange=async()=>{submit.disabled=true;try{await renderCrew('#reportCrew',reportUnit.value,assignments);submit.disabled=false}catch(e){showError(e)}};submit.disabled=false}
    if(me.role==='wehrleitung')bindForm('#consolidate',async d=>{await api(`/api/incidents/${id}/consolidation`,{method:'PUT',body:JSON.stringify(d)});await load();incident(id)})
  }catch(e){showError(e)}
}
function localDateTime(value){if(!value)return'';const date=new Date(value);return Number.isNaN(date.getTime())?'':new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function contactFields(key,title,value){const person=JSON.parse(value||'{}'),open=Object.values(person).some(Boolean);return `<details class="form-section" ${open?'open':''}><summary>${title}</summary><div class="grid"><label>Name<input name="${key}Name" value="${esc(person.name)}"></label><label>Telefon<input name="${key}Phone" type="tel" value="${esc(person.phone)}"></label><label>Adresse<input name="${key}Address" value="${esc(person.address)}"></label></div></details>`}
function rankOptions(selected=''){const options=Object.entries(ranks);if(selected&&ranks[selected]===undefined)options.unshift([selected,'']);return `<option value="">Keine Angabe</option>${options.map(([code,name])=>`<option value="${esc(code)}" ${selected===code?'selected':''}>${esc(name?`${code} – ${name}`:code)}</option>`).join('')}`}
function reportDetailsFields(prefix,incident,report={}){const selected=JSON.parse(report.classification||'{}'),command=JSON.parse(report.incident_command||'{}');return `<div class="report-fields"><div class="grid"><label>DIVERA-Einsatznummer<input value="${esc(incident.foreign_id||'Nicht vorhanden')}" readonly></label><label>Laufende Nummer<input name="runningNumber" maxlength="50" value="${esc(report.running_number)}" placeholder="z. B. 69/2026" required></label><label>Alarmiert um${incident.divera_id?' (aus DIVERA)':''}<input name="alarmedAt" type="datetime-local" value="${localDateTime(report.alarmed_at||incident.started_at)}" readonly></label><label>Ausgerückt um<input name="departedAt" type="datetime-local" value="${localDateTime(report.departed_at)}" required></label><label>Eingetroffen um<input name="arrivedAt" type="datetime-local" value="${localDateTime(report.arrived_at)}" required></label><label>Einsatz beendet um<input name="endedAt" type="datetime-local" value="${localDateTime(report.ended_at)}" required></label><output class="duration" aria-live="polite">Einsatzdauer: –</output><label>Einsatzart<select name="incidentType" required><option value="">Bitte wählen</option>${incidentTypes.map(type=>`<option ${report.incident_type===type?'selected':''}>${esc(type)}</option>`).join('')}</select></label></div><details class="form-section" open><summary>Einsatzleitung</summary><div class="grid"><div class="command-row"><label>Dienstgrad Gesamteinsatzleitung<select name="commandRank">${rankOptions(command.rank)}</select></label><label>Name Gesamteinsatzleitung<input name="commandName" value="${esc(command.name)}"></label></div><div class="command-row"><label>Dienstgrad Einsatzleitung der Einheit<select name="additionalCommandRank">${rankOptions(command.additionalRank)}</select></label><label>Name Einsatzleitung der Einheit<input name="additionalCommandName" value="${esc(command.additionalName)}"></label></div></div></details>${contactFields('damaged','Geschädigte Person',report.damaged_party)}${contactFields('damaging','Schädiger',report.damaging_party)}<h3>Aufgliederung</h3>${Object.entries(reportClassifications).map(([key,values])=>`<details class="form-section" ${(selected[key]||[]).length?'open':''}><summary>${esc(classificationLabels[key]||key)}</summary><div class="check-grid">${values.map(value=>`<label><input type="checkbox" data-classification="${esc(key)}" value="${esc(value)}" ${(selected[key]||[]).includes(value)?'checked':''}>${esc(value)}</label>`).join('')}</div></details>`).join('')}</div>`}
function bindDuration(form){const update=()=>form.querySelector('.duration').textContent=`Einsatzdauer: ${durationText(form.elements.alarmedAt.value,form.elements.endedAt.value)}`;form.elements.endedAt.addEventListener('input',update);update()}
function reportDetailsPayload(form){const classification=Object.fromEntries(Object.keys(reportClassifications).map(key=>[key,[]]));form.querySelectorAll('[data-classification]:checked').forEach(input=>classification[input.dataset.classification].push(input.value));return{runningNumber:form.elements.runningNumber.value,departedAt:new Date(form.elements.departedAt.value).toISOString(),arrivedAt:new Date(form.elements.arrivedAt.value).toISOString(),endedAt:new Date(form.elements.endedAt.value).toISOString(),incidentType:form.elements.incidentType.value,damagedParty:{name:form.elements.damagedName.value,phone:form.elements.damagedPhone.value,address:form.elements.damagedAddress.value},damagingParty:{name:form.elements.damagingName.value,phone:form.elements.damagingPhone.value,address:form.elements.damagingAddress.value},incidentCommand:{rank:form.elements.commandRank.value,name:form.elements.commandName.value,additionalRank:form.elements.additionalCommandRank.value,additionalName:form.elements.additionalCommandName.value},classification}}
function durationText(start,end){const minutes=Math.round((new Date(end)-new Date(start))/60000);return Number.isFinite(minutes)&&minutes>=0?`${Math.floor(minutes/60)} Std. ${minutes%60} Min.`:'–'}
function formatDateTime(value){return value?new Date(value).toLocaleString('de-DE'):'–'}
function reportTimes(report){return `<dl class="report-times"><div><dt>Alarmiert</dt><dd>${formatDateTime(report.alarmed_at)}</dd></div><div><dt>Ausgerückt</dt><dd>${formatDateTime(report.departed_at)}</dd></div><div><dt>Eingetroffen</dt><dd>${formatDateTime(report.arrived_at)}</dd></div><div><dt>Beendet</dt><dd>${formatDateTime(report.ended_at)}</dd></div><div><dt>Dauer</dt><dd>${durationText(report.alarmed_at,report.ended_at)}</dd></div></dl>`}
function contactSummary(title,value){const person=JSON.parse(value||'{}'),details=[person.name,person.phone,person.address].filter(Boolean);return details.length?`<p><b>${title}:</b> ${details.map(esc).join(' · ')}</p>`:''}
function commandSummary(value){const command=JSON.parse(value||'{}'),people=[['Gesamteinsatzleitung',command.rank,command.name],['Einsatzleitung der Einheit',command.additionalRank,command.additionalName]].filter(([,rank,name])=>rank||name);return people.length?`<p><b>Einsatzleitung:</b><br>${people.map(([label,rank,name])=>`${label}: ${[rank,name].filter(Boolean).map(esc).join(' ')}`).join('<br>')}</p>`:''}
function classificationSummary(value){const selected=JSON.parse(value||'{}'),rows=Object.entries(selected).filter(([,values])=>values?.length).map(([key,values])=>`<b>${esc(classificationLabels[key]||key)}:</b> ${values.map(esc).join(', ')}`);return rows.length?`<p>${rows.join('<br>')}</p>`:''}
async function renderCrew(selector,unitId,assignments,selected=[]){
  const root=document.querySelector(selector),members=await api(`/api/units/${unitId}/members`),vehicles=JSON.parse(assignments.find(a=>a.unitId===Number(unitId))?.vehicles||'[]').filter(vehicle=>typeof vehicle==='string'||vehicle.own!==false).map(vehicle=>typeof vehicle==='string'?vehicle:vehicle.name),chosen=new Map(selected.map(person=>[person.memberId,{...person,role:person.role==='mannschaft'?'besatzung':person.role}])),roles=[['maschinist','Maschinist'],['einheitsfuehrer','Einheitsführer'],['besatzung','Besatzung']];
  const zones=[{key:'available',vehicle:'',role:'',label:'Verfügbar'},{key:'none',vehicle:'',role:'besatzung',label:'Ohne Fahrzeug'},...vehicles.flatMap((vehicle,index)=>roles.map(([role,label])=>({key:`vehicle-${index}-${role}`,vehicle,role,label})))];
  const targetFor=member=>{const person=chosen.get(member.id);if(!person)return'available';if(!person.vehicle)return'none';return zones.find(zone=>zone.vehicle===person.vehicle&&zone.role===(person.role||'besatzung'))?.key||'available'};
  const options=current=>zones.map(zone=>`<option value="${zone.key}" ${current===zone.key?'selected':''}>${zone.key==='available'?'Nicht eingesetzt':zone.key==='none'?'Ohne Fahrzeug':`${esc(zone.vehicle)}: ${zone.label}`}</option>`).join('');
  const card=member=>{const current=targetFor(member);return `<article class="crew-person" draggable="${dragEnabled}" data-person="${member.id}"><strong>${esc(member.name)}</strong>${member.qualifications?`<small class="muted">${esc(member.qualifications)}</small>`:''}<select data-member="${member.id}" aria-label="Zuordnung für ${esc(member.name)}">${options(current)}</select></article>`};
  const cardsFor=key=>members.filter(member=>targetFor(member)===key).map(card).join('');
  const roleZone=zone=>`<section class="crew-zone crew-role" data-target="${zone.key}" data-vehicle="${esc(zone.vehicle)}" data-role="${zone.role}"><h5>${zone.label} <span data-count></span></h5><div class="crew-list">${cardsFor(zone.key)}</div></section>`;
  root.innerHTML=`<h3>Besatzung</h3><p class="muted">Auf Touch-Geräten oder mit Tastatur das Auswahlfeld verwenden; alternativ kann Personal mit der Maus gezogen werden.</p><div class="vehicle-board">${vehicles.map((vehicle,index)=>`<section class="vehicle-column"><h4>${esc(vehicle)}</h4>${roles.map(([role])=>roleZone(zones.find(zone=>zone.key===`vehicle-${index}-${role}`))).join('')}</section>`).join('')}<section class="vehicle-column"><h4>Ohne Fahrzeug</h4>${roleZone(zones.find(zone=>zone.key==='none'))}</section></div><details class="crew-available" open><summary>Verfügbares Personal</summary><section class="crew-zone crew-pool" data-target="available" data-vehicle="" data-role=""><h4>Mitglieder <span data-count></span></h4><div class="crew-list">${cardsFor('available')}</div></section></details>${members.length?'':'<p class="muted">Keine Mitglieder synchronisiert.</p>'}`;
  bindCrewBoard(root);
}
function bindCrewBoard(root){
  const zones=[...root.querySelectorAll('.crew-zone')],cards=[...root.querySelectorAll('.crew-person')];
  const move=(card,target)=>{const zone=zones.find(item=>item.dataset.target===target);if(!card||!zone)return;if(['maschinist','einheitsfuehrer'].includes(zone.dataset.role)){const previous=zone.querySelector('.crew-person');if(previous&&previous!==card){const available=zones.find(item=>item.dataset.target==='available');previous.querySelector('[data-member]').value='available';available.querySelector('.crew-list').append(previous)}}card.querySelector('[data-member]').value=target;zone.querySelector('.crew-list').append(card);zones.forEach(updateCrewCount)};
  cards.forEach(card=>{if(dragEnabled){card.ondragstart=e=>{card.classList.add('dragging');e.dataTransfer.setData('text/plain',card.dataset.person)};card.ondragend=()=>card.classList.remove('dragging')}card.querySelector('[data-member]').onchange=e=>move(card,e.target.value)});
  zones.forEach(zone=>{zone.ondragover=e=>{e.preventDefault();zone.classList.add('over')};zone.ondragleave=()=>zone.classList.remove('over');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('over');move(cards.find(card=>card.dataset.person===e.dataTransfer.getData('text/plain')),zone.dataset.target)};updateCrewCount(zone)});
}
function updateCrewCount(zone){zone.querySelector('[data-count]').textContent=zone.querySelectorAll('.crew-person').length}
function crewSummary(value){const labels={einheitsfuehrer:'Einheitsführer',maschinist:'Maschinist',besatzung:'Besatzung',mannschaft:'Besatzung'},order=['einheitsfuehrer','maschinist','besatzung'],vehicles=JSON.parse(value||'[]').reduce((all,person)=>{const vehicle=person.vehicle||'Ohne Fahrzeug',role=person.role==='mannschaft'?'besatzung':person.role||'besatzung';((all[vehicle]??={})[role]??=[]).push(person.name);return all},{});return Object.entries(vehicles).map(([vehicle,roles])=>`${esc(vehicle)}: ${order.filter(role=>roles[role]?.length).map(role=>`${roles[role].map(esc).join(', ')} (${labels[role]})`).join('; ')}`).join('<br>')||'Keine Besatzung'}
function vehicleSummary(assignments){return assignments.flatMap(assignment=>JSON.parse(assignment.vehicles||'[]').map(vehicle=>typeof vehicle==='string'?esc(vehicle):`${esc(vehicle.name)} · ${vehicle.own?'eigene Einheit':'andere Einheit'}`)).join('<br>')||'Keine Fahrzeuge'}
function selectedCrew(selector){const root=document.querySelector(selector);return [...root.querySelectorAll('[data-member]')].filter(select=>select.value!=='available').map(select=>{const zone=[...root.querySelectorAll('.crew-zone')].find(item=>item.dataset.target===select.value);return{memberId:Number(select.dataset.member),vehicle:zone.dataset.vehicle,role:zone.dataset.role}})}
function restoreDialogFocus(opener){dialog.addEventListener('close',()=>{if(opener?.isConnected)opener.focus()},{once:true})}
async function editReport(id){const opener=document.activeElement,r=currentReports.find(x=>x.id===id);dialog.innerHTML=`<form id="edit"><h2 id="dialogTitle" tabindex="-1">Bericht bearbeiten</h2>${reportDetailsFields('edit',currentIncident,r)}<div id="editCrew"></div><label>Einsatzverlauf<textarea name="narrative" required>${esc(r.narrative)}</textarea></label><p><button type="submit" disabled>Speichern</button> <button type="button" class="secondary" onclick="dialog.close()">Abbrechen</button></p></form>`;restoreDialogFocus(opener);dialog.showModal();document.querySelector('#dialogTitle').focus();const form=document.querySelector('#edit'),submit=form.querySelector('button[type=submit]');bindForm('#edit',async d=>{Object.assign(d,reportDetailsPayload(form));d.crew=selectedCrew('#editCrew');await api(`/api/reports/${r.id}`,{method:'PUT',body:JSON.stringify(d)});dialog.close();incident(r.incident_id)});try{await renderCrew('#editCrew',r.unit_id,currentAssignments,JSON.parse(r.crew));bindDuration(form);submit.disabled=false}catch(e){showError(e)}}
async function releaseReport(reportId,incidentId){try{await api(`/api/reports/${reportId}/release`,{method:'POST'});incident(incidentId)}catch(e){showError(e)}}
function resources(){const allowed=me.role==='wehrleitung'?units:units.filter(unit=>me.unitIds.includes(unit.id));app.innerHTML=`<section class="card"><h1>Mitglieder & Fahrzeuge</h1><label>Einheit<select id="resourceUnit">${allowed.map(unit=>`<option value="${unit.id}">${esc(unit.name)}</option>`).join('')}</select></label></section><div id="resources" aria-live="polite"></div>`;focusMain();const select=document.querySelector('#resourceUnit');select.onchange=()=>renderResources(select.value).catch(showError);renderResources(select.value).catch(showError)}
async function renderResources(unitId){const members=await api(`/api/units/${unitId}/members`),vehicles=new Map();for(const incident of incidents)for(const assignment of JSON.parse(incident.assignments||'[]'))if(assignment.unitId===Number(unitId))for(const vehicle of JSON.parse(assignment.vehicles||'[]')){const item=typeof vehicle==='string'?{id:vehicle,name:vehicle,own:true}:vehicle,key=item.id||item.name;if(!vehicles.has(key))vehicles.set(key,item)}const own=[...vehicles.values()].filter(vehicle=>vehicle.own!==false),external=[...vehicles.values()].filter(vehicle=>vehicle.own===false),rows=list=>list.map(vehicle=>`<p><b>${esc(vehicle.name)}</b>${vehicle.fullname?` · ${esc(vehicle.fullname)}`:''}</p>`).join('')||'<p class="muted">Keine Fahrzeuge importiert.</p>';document.querySelector('#resources').innerHTML=`<section class="card"><h2>Mitglieder (${members.length})</h2>${members.map(member=>`<p><b>${esc(member.name)}</b>${member.qualifications?` · ${esc(member.qualifications)}`:''}</p>`).join('')||'<p class="muted">Keine Mitglieder synchronisiert.</p>'}</section><section class="card"><h2>Eigene Fahrzeuge (${own.length})</h2>${rows(own)}<p class="muted">Stand des jeweils letzten Einsatzimports.</p></section>${external.length?`<section class="card"><h2>Fahrzeuge anderer Einheiten (${external.length})</h2>${rows(external)}</section>`:''}`}
async function admin(){
  try{const users=await api('/api/users');window.currentUsers=users;app.innerHTML=`<section class="card"><h1>Verwaltung</h1><h2>Einheit anlegen</h2><form id="unit" class="grid"><label>Name<input name="name" required></label><button>Anlegen</button></form></section>
  <section class="card"><h2>Benutzer anlegen</h2><form id="user" class="grid"><label>Name<input name="name" autocomplete="name" required></label><label>E-Mail<input name="email" type="email" autocomplete="email" required></label>
  <label>Rolle<select name="role"><option value="fuehrungskraft">Führungskraft</option><option value="einheitsleitung">Einheitsführung</option><option value="wehrleitung">Wehrführung</option></select></label>
  <fieldset><legend>Einheiten</legend><div class="check-grid">${units.map(u=>`<label><input type="checkbox" name="unitIds" value="${u.id}">${esc(u.name)}</label>`).join('')}</div></fieldset>
  <p>Der Benutzer erhält per E-Mail einen Link, um sein Konto zu aktivieren und ein Passwort festzulegen.</p><button>Einladung senden</button></form></section>
  <section class="card"><h2>Benutzer</h2>${users.map(u=>`<p><b>${esc(u.name)}</b> · ${esc(u.role)} · ${esc(u.unit_names||'wehrweit')} <button onclick="editUser(${u.id})">Bearbeiten</button><br><small class="muted">Letzte Anmeldungen: ${u.loginHistory.length?u.loginHistory.map(formatDateTime).join(' · '):'noch keine'}</small></p>`).join('')}</section>`;
  focusMain();
  bindForm('#unit',async d=>{await api('/api/units',{method:'POST',body:JSON.stringify(d)});await load();admin()});
  bindForm('#user',async d=>{d.unitIds=[...document.querySelectorAll('#user [name=unitIds]:checked')].map(o=>o.value);await api('/api/users',{method:'POST',body:JSON.stringify(d)});admin()})}catch(e){showError(e)}
}
function editUser(id){const opener=document.activeElement,u=currentUsers.find(x=>x.id===id),ids=JSON.parse(u.unit_ids);dialog.innerHTML=`<form id="editUser"><h2 id="dialogTitle" tabindex="-1">Benutzer bearbeiten</h2><div class="grid"><label>Name<input name="name" value="${esc(u.name)}" autocomplete="name" required></label><label>E-Mail<input name="email" type="email" value="${esc(u.email)}" autocomplete="email" required></label><label>Rolle<select name="role">${['fuehrungskraft','einheitsleitung','wehrleitung'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label><fieldset><legend>Einheiten</legend><div class="check-grid">${units.map(unit=>`<label><input type="checkbox" name="unitIds" value="${unit.id}" ${ids.includes(unit.id)?'checked':''}>${esc(unit.name)}</label>`).join('')}</div></fieldset><label>Neues Passwort (optional)<input name="password" type="password" autocomplete="new-password" minlength="10"></label></div><p><button>Speichern</button> <button type="button" class="secondary" onclick="dialog.close()">Abbrechen</button></p></form>`;restoreDialogFocus(opener);dialog.showModal();document.querySelector('#dialogTitle').focus();bindForm('#editUser',async d=>{d.unitIds=[...document.querySelectorAll('#editUser [name=unitIds]:checked')].map(o=>o.value);await api(`/api/users/${id}`,{method:'PUT',body:JSON.stringify(d)});dialog.close();admin()})}
async function systemOverview(){try{const data=await api('/api/system'),yes=value=>value?'Ja':'Nein';app.innerHTML=`<h1>System</h1>
  <section class="card"><h2>Anwendung</h2><p><b>Adresse:</b> ${esc(data.application.url||'Nicht konfiguriert')}<br><b>PHP:</b> ${esc(data.application.phpVersion)}<br><b>Einrichtungstoken:</b> ${yes(data.application.setupConfigured)}</p></section>
  <section class="card"><h2>Datenbank</h2><p><b>Status:</b> ${esc(data.database.status)}<br><b>Datenbank:</b> ${esc(data.database.name||'–')}<br><b>Server:</b> ${esc(data.database.serverVersion||'–')}</p></section>
  <section class="card"><h2>E-Mail</h2><p><b>Konfiguriert:</b> ${yes(data.email.configured)}<br><b>Transport:</b> ${esc(data.email.transport)}<br><b>Absender:</b> ${esc(data.email.from||'–')}${data.email.host?`<br><b>Server:</b> ${esc(data.email.host)}:${esc(data.email.port)}<br><b>Benutzer:</b> ${esc(data.email.username)}`:''}${data.email.error?`<br><span class="error">${esc(data.email.error)}</span>`:''}</p></section>
  <section class="card"><h2>Einheiten (${data.units.length})</h2>${data.units.map(unit=>`<p><b>${esc(unit.name)}</b> · DIVERA ${unit.diveraConfigured?'konfiguriert':'nicht konfiguriert'}</p>`).join('')||'<p>Keine Einheiten angelegt.</p>'}</section>
  <section class="card"><h2>Benutzer (${data.users.length})</h2>${data.users.map(user=>`<p><b>${esc(user.name)}</b> · ${esc(user.email)} · ${esc(user.role)} · ${esc(user.units||'wehrweit')}</p>`).join('')||'<p>Keine Benutzer angelegt.</p>'}</section>`;focusMain()}catch(e){showError(e)}}
function divera(){const allowed=me.role==='wehrleitung'?units:units.filter(u=>me.unitIds.includes(u.id));app.innerHTML=`<section class="card"><h1>DIVERA 24/7</h1><form id="divera" class="grid">
  <label>Einheit<select name="unitId">${allowed.map(u=>`<option value="${u.id}">${esc(u.name)}${u.divera_configured?' ✓':''}</option>`).join('')}</select></label>
  <label>Access-Key<input name="accessKey" type="password" required autocomplete="off"></label><button>Speichern</button></form></section>
  <section class="card"><h2>Daten abrufen</h2><label>Einheit<select id="pullUnit">${allowed.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label><p><button onclick="pullDivera()">Einsätze abrufen</button> <button onclick="syncMembers()">Mitglieder synchronisieren</button></p><div id="diveraResults" role="status" aria-live="polite"></div></section>`;
  focusMain();bindForm('#divera',async d=>{await api(`/api/units/${d.unitId}/divera`,{method:'PUT',body:JSON.stringify(d)});await load();divera()})}
function importedForUnit(diveraId,unitId){return incidents.some(incident=>incident.divera_id===String(diveraId)&&JSON.parse(incident.assignments||'[]').some(assignment=>assignment.unitId===Number(unitId)))}
async function pullDivera(){const unitId=document.querySelector('#pullUnit').value,out=document.querySelector('#diveraResults');out.textContent='Lade …';try{const data=await api(`/api/units/${unitId}/divera`);out.innerHTML=data.alarms.map((a,i)=>{const imported=importedForUnit(a.id,unitId);return `<article class="report"><b>${esc(a.title)}</b><p>${esc(a.address)}<br><span class="muted">${a.vehicles.map(v=>`${esc(v.name)} · ${v.own?'eigene Einheit':'andere Einheit'}`).join(', ')}</span></p><button data-import="${i}" ${imported?'disabled':''}>${imported?'Bereits importiert':'Importieren'}</button></article>`}).join('')||'<p>Keine Einsätze gefunden.</p>';[...out.querySelectorAll('[data-import]')].forEach(button=>button.onclick=async()=>{await api(`/api/units/${unitId}/divera/import`,{method:'POST',body:JSON.stringify({id:data.alarms[Number(button.dataset.import)].id})});await load();divera()})}catch(e){out.innerHTML=`<p class="error" role="alert">${esc(e.message)}</p>`}}
async function syncMembers(){const unitId=document.querySelector('#pullUnit').value,out=document.querySelector('#diveraResults');out.textContent='Synchronisiere …';try{const result=await api(`/api/units/${unitId}/divera/members/sync`,{method:'POST'}),members=await api(`/api/units/${unitId}/members`);out.innerHTML=`<p>${result.count} Mitglieder synchronisiert.</p>${members.map(m=>`<div>${esc(m.name)}</div>`).join('')}`}catch(e){out.innerHTML=`<p class="error" role="alert">${esc(e.message)}</p>`}}
start().catch(showError);
</script>
