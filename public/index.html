<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Einsatzberichte</title>
  <style>
    :root{font:16px system-ui;color:#18202b;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{background:#b71918;color:#fff;padding:1rem 4vw;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:2rem auto;padding:0 1rem}.card{background:#fff;border-radius:.6rem;padding:1rem;margin:1rem 0;box-shadow:0 1px 5px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}label{display:grid;gap:.3rem;font-weight:600}input,select,textarea,button{font:inherit;padding:.65rem;border:1px solid #aeb7c2;border-radius:.35rem}textarea{min-height:7rem;resize:vertical}button{background:#b71918;color:white;border:0;cursor:pointer}button.secondary{background:#536170}nav{display:flex;gap:.5rem;flex-wrap:wrap}.hidden{display:none}.error{background:#ffe5e5;color:#8d0000;padding:.7rem;border-radius:.35rem}.muted{color:#67717d}.report{border-left:4px solid #b71918;padding-left:1rem;margin:1rem 0}h1,h2,h3{margin:.3rem 0 1rem}dialog{border:0;border-radius:.6rem;max-width:700px;width:calc(100% - 2rem)}@media(max-width:600px){header{align-items:flex-start;gap:1rem;flex-direction:column}}
  </style>
</head>
<body>
<header><strong>🚒 Einsatzberichte</strong><nav id="nav"></nav></header>
<main id="app"></main>
<dialog id="dialog"></dialog>
<script>
const app=document.querySelector('#app'),nav=document.querySelector('#nav'),dialog=document.querySelector('#dialog');
let me,units=[],incidents=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json',...options.headers}}),data=await r.json();if(!r.ok)throw Error(data.error);return data}
function formData(form){return Object.fromEntries(new FormData(form))}
function showError(e){app.insertAdjacentHTML('afterbegin',`<p class="error">${esc(e.message)}</p>`)}
function bindForm(id,handler){document.querySelector(id).onsubmit=async e=>{e.preventDefault();try{await handler(formData(e.target));}catch(x){showError(x)}}}
async function start(){
  const state=await api('/api/bootstrap');
  if(state.needsSetup)return setup();
  try{me=await api('/api/me');await load();home()}catch{login()}
}
function setup(){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>Ersteinrichtung</h1><form id="setup" class="grid">
  <label>Wehr<input name="organization" required></label><label>Erste Einheit<input name="unit" required></label>
  <label>Ihr Name<input name="name" required></label><label>E-Mail<input name="email" type="email" required></label>
  <label>Passwort (min. 10 Zeichen)<input name="password" type="password" minlength="10" required></label><button>Einrichten</button>
  </form></section>`;bindForm('#setup',async d=>{await api('/api/setup',{method:'POST',body:JSON.stringify(d)});login()})}
function login(){nav.innerHTML='';app.innerHTML=`<section class="card"><h1>Anmelden</h1><form id="login" class="grid">
  <label>E-Mail<input name="email" type="email" required></label><label>Passwort<input name="password" type="password" required></label><button>Anmelden</button>
  </form></section>`;bindForm('#login',async d=>{await api('/api/login',{method:'POST',body:JSON.stringify(d)});me=await api('/api/me');await load();home()})}
async function load(){[units,incidents]=await Promise.all([api('/api/units'),api('/api/incidents')]);nav.innerHTML=`
  <button onclick="home()">Einsätze</button>${me.role==='wehrleitung'?'<button onclick="admin()">Verwaltung</button>':''}
  ${me.role!=='fuehrungskraft'?'<button onclick="divera()">DIVERA</button>':''}<button class="secondary" onclick="logout()">Abmelden</button>`}
async function logout(){await api('/api/logout',{method:'POST'});me=null;login()}
function home(){app.innerHTML=`<h1>${esc(me.organization_name)}</h1><p class="muted">${esc(me.name)} · ${esc(me.role)}</p>
  <section class="card"><h2>Einsatz anlegen</h2><form id="incident" class="grid">
  <label>Stichwort<input name="title" required></label><label>Zeitpunkt<input name="startedAt" type="datetime-local" required></label>
  <label>Adresse<input name="address"></label><label>Einheiten<select name="unitIds" multiple required>${units.filter(u=>me.role==='wehrleitung'||me.unitIds.includes(u.id)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label><button>Anlegen</button></form></section>
  <section><h2>Einsätze</h2>${incidents.map(i=>`<article class="card"><h3>${esc(i.title)}</h3><p>${esc(new Date(i.started_at).toLocaleString('de-DE'))} · ${esc(i.address)}<br><span class="muted">${esc(i.units)}</span></p><button onclick="incident(${i.id})">Öffnen</button></article>`).join('')||'<p>Noch keine Einsätze.</p>'}</section>`;
  bindForm('#incident',async d=>{d.unitIds=[...document.querySelector('[name=unitIds]').selectedOptions].map(o=>o.value);await api('/api/incidents',{method:'POST',body:JSON.stringify(d)});await load();home()})}
async function incident(id){
  try{
    const item=incidents.find(i=>i.id===id),reports=await api(`/api/incidents/${id}/reports`);
    window.currentReports=reports;
    const assignments=JSON.parse(item.assignments||'[]'),assignedVehicles=[...new Set(assignments.flatMap(a=>JSON.parse(a.vehicles||'[]')))].join(', ');
    const reportUnits=units.filter(u=>assignments.some(a=>a.unitId===u.id)&&(me.role==='wehrleitung'||me.unitIds.includes(u.id)));
    app.innerHTML=`<button class="secondary" onclick="home()">← Zurück</button><section class="card"><h1>${esc(item.title)}</h1><p>${esc(item.units)} · ${esc(item.address)}</p></section>
    <section class="card"><h2>Bericht schreiben</h2><form id="report" class="grid">
    <label>Einheit<select name="unitId">${reportUnits.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>
    <label>Fahrzeuge<textarea name="vehicles" placeholder="z. B. LF 10, MTF">${esc(assignedVehicles)}</textarea></label><label>Personal<textarea name="personnel" placeholder="Namen oder Funktionen"></textarea></label>
    <label style="grid-column:1/-1">Einsatzverlauf<textarea name="narrative" required></textarea></label><button>Speichern</button></form></section>
    <section class="card"><h2>Einzelberichte</h2>${reports.map(r=>`<article class="report"><strong>${esc(r.unit_name)} · ${esc(r.author_name)}</strong> <span class="muted">${r.status==='released'?'freigegeben':'Entwurf'}</span>
    <p><b>Fahrzeuge:</b> ${esc(r.vehicles)}<br><b>Personal:</b> ${esc(r.personnel)}</p><p>${esc(r.narrative).replace(/\n/g,'<br>')}</p>
    ${r.status==='draft'&&((r.author_id===me.id)||(me.role==='einheitsleitung'&&me.unitIds.includes(r.unit_id)))?`<button onclick="editReport(${r.id})">Bearbeiten</button> `:''}
    ${r.status==='draft'&&(me.role==='wehrleitung'||(me.role==='einheitsleitung'&&me.unitIds.includes(r.unit_id)))?`<button onclick="releaseReport(${r.id},${id})">Freigeben</button>`:''}</article>`).join('')||'<p>Noch keine Berichte.</p>'}</section>
    ${me.role==='wehrleitung'?`<section class="card"><h2>Gesamtbericht</h2><form id="consolidate"><label>Konsolidierter Bericht<textarea name="text" required>${esc(item.consolidated_text)}</textarea></label><button>Speichern</button></form></section>`:''}`;
    bindForm('#report',async d=>{await api(`/api/incidents/${id}/reports`,{method:'POST',body:JSON.stringify(d)});incident(id)});
    if(me.role==='wehrleitung')bindForm('#consolidate',async d=>{await api(`/api/incidents/${id}/consolidation`,{method:'PUT',body:JSON.stringify(d)});await load();incident(id)})
  }catch(e){showError(e)}
}
function editReport(id){const r=currentReports.find(x=>x.id===id);dialog.innerHTML=`<form id="edit"><h2>Bericht bearbeiten</h2><label>Fahrzeuge<textarea name="vehicles">${esc(r.vehicles)}</textarea></label><label>Personal<textarea name="personnel">${esc(r.personnel)}</textarea></label><label>Einsatzverlauf<textarea name="narrative" required>${esc(r.narrative)}</textarea></label><p><button>Speichern</button> <button type="button" class="secondary" onclick="dialog.close()">Abbrechen</button></p></form>`;dialog.showModal();bindForm('#edit',async d=>{await api(`/api/reports/${r.id}`,{method:'PUT',body:JSON.stringify(d)});dialog.close();incident(r.incident_id)})}
async function releaseReport(reportId,incidentId){try{await api(`/api/reports/${reportId}/release`,{method:'POST'});incident(incidentId)}catch(e){showError(e)}}
async function admin(){
  try{const users=await api('/api/users');window.currentUsers=users;app.innerHTML=`<section class="card"><h1>Verwaltung</h1><h2>Einheit anlegen</h2><form id="unit" class="grid"><label>Name<input name="name" required></label><button>Anlegen</button></form></section>
  <section class="card"><h2>Benutzer anlegen</h2><form id="user" class="grid"><label>Name<input name="name" required></label><label>E-Mail<input name="email" type="email" required></label>
  <label>Rolle<select name="role"><option value="fuehrungskraft">Führungskraft</option><option value="einheitsleitung">Einheitsführung</option><option value="wehrleitung">Wehrführung</option></select></label>
  <label>Einheiten<select name="unitIds" multiple>${units.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>
  <label>Startpasswort<input name="password" minlength="10" required></label><button>Anlegen</button></form></section>
  <section class="card"><h2>Benutzer</h2>${users.map(u=>`<p><b>${esc(u.name)}</b> · ${esc(u.role)} · ${esc(u.unit_names||'wehrweit')} <button onclick="editUser(${u.id})">Bearbeiten</button></p>`).join('')}</section>`;
  bindForm('#unit',async d=>{await api('/api/units',{method:'POST',body:JSON.stringify(d)});await load();admin()});
  bindForm('#user',async d=>{d.unitIds=[...document.querySelector('#user [name=unitIds]').selectedOptions].map(o=>o.value);await api('/api/users',{method:'POST',body:JSON.stringify(d)});admin()})}catch(e){showError(e)}
}
function editUser(id){const u=currentUsers.find(x=>x.id===id),ids=JSON.parse(u.unit_ids);dialog.innerHTML=`<form id="editUser"><h2>Benutzer bearbeiten</h2><div class="grid"><label>Name<input name="name" value="${esc(u.name)}" required></label><label>E-Mail<input name="email" type="email" value="${esc(u.email)}" required></label><label>Rolle<select name="role">${['fuehrungskraft','einheitsleitung','wehrleitung'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Einheiten<select name="unitIds" multiple>${units.map(unit=>`<option value="${unit.id}" ${ids.includes(unit.id)?'selected':''}>${esc(unit.name)}</option>`).join('')}</select></label><label>Neues Passwort (optional)<input name="password" minlength="10"></label></div><p><button>Speichern</button> <button type="button" class="secondary" onclick="dialog.close()">Abbrechen</button></p></form>`;dialog.showModal();bindForm('#editUser',async d=>{d.unitIds=[...document.querySelector('#editUser [name=unitIds]').selectedOptions].map(o=>o.value);await api(`/api/users/${id}`,{method:'PUT',body:JSON.stringify(d)});dialog.close();admin()})}
function divera(){const allowed=me.role==='wehrleitung'?units:units.filter(u=>me.unitIds.includes(u.id));app.innerHTML=`<section class="card"><h1>DIVERA 24/7</h1><form id="divera" class="grid">
  <label>Einheit<select name="unitId">${allowed.map(u=>`<option value="${u.id}">${esc(u.name)}${u.divera_configured?' ✓':''}</option>`).join('')}</select></label>
  <label>Access-Key<input name="accessKey" type="password" required autocomplete="off"></label><button>Speichern</button></form></section>
  <section class="card"><h2>Einsätze abrufen</h2><label>Einheit<select id="pullUnit">${allowed.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label><p><button onclick="pullDivera()">Jetzt abrufen</button></p><div id="diveraResults"></div></section>`;
  bindForm('#divera',async d=>{await api(`/api/units/${d.unitId}/divera`,{method:'PUT',body:JSON.stringify(d)});await load();divera()})}
async function pullDivera(){const unitId=document.querySelector('#pullUnit').value,out=document.querySelector('#diveraResults');out.textContent='Lade …';try{const data=await api(`/api/units/${unitId}/divera`);out.innerHTML=data.alarms.map(a=>`<article class="report"><b>${esc(a.title)}</b><p>${esc(a.address)}<br><span class="muted">${esc(a.vehicles.join(', '))}</span></p><button>Importieren</button></article>`).join('')||'<p>Keine Einsätze gefunden.</p>';[...out.querySelectorAll('button')].forEach((b,i)=>b.onclick=async()=>{await api(`/api/units/${unitId}/divera/import`,{method:'POST',body:JSON.stringify(data.alarms[i])});await load();home()})}catch(e){out.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
start().catch(showError);
</script>
</body>
</html>
